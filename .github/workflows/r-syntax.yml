name: R syntax

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Parse every R script
        run: |
          Rscript -e 'files <- list.files(".", pattern="[.]R$", recursive=TRUE, full.names=TRUE); invisible(lapply(files, parse)); cat(length(files), " R files parsed OK\n")'
